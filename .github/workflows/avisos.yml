name: Avisos Importaciones Yesica

on:
  schedule:
    # Cada 5 minutos. OJO: GitHub NO garantiza los cron en repos gratuitos y se
    # salta corridas cuando sus servidores están cargados. Por eso pedimos cada 5:
    # aunque se salte varias, alguna cae dentro del intervalo de avisos.
    # Para puntualidad real, usar el disparador externo de abajo (repository_dispatch).
    - cron: '*/5 * * * *'
  workflow_dispatch:      # botón para correrlo a mano
  repository_dispatch:    # disparador externo (cron-job.org) — puntual al minuto
    types: [avisar]

# Evita que se encimen dos corridas
concurrency:
  group: avisos-yesica
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          npm init -y --scope=avisos >/dev/null 2>&1 || true
          npm pkg set type=module >/dev/null
          npm install firebase-admin@12 --no-audit --no-fund

      - name: Revisar tareas y enviar avisos
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: node scripts/avisos.js
