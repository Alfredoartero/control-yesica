name: Avisos Importaciones Yesica

on:
  schedule:
    # Cada 15 minutos. GitHub puede retrasarlo unos minutos en horas pico.
    - cron: '*/15 * * * *'
  workflow_dispatch:      # botón para correrlo a mano y probar

# Evita que se encimen dos corridas
concurrency:
  group: avisos-yesica
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          npm init -y --scope=avisos >/dev/null 2>&1 || true
          npm pkg set type=module >/dev/null
          npm install firebase-admin@12 --no-audit --no-fund

      - name: Revisar tareas y enviar avisos
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node scripts/avisos.js
