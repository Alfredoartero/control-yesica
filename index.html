<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importaciones Yesica - Centro de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap');
        :root { --bg-base: #030712; --accent: #e11d48; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: #f8fafc; background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 32px 32px; }
        .font-tech { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .led { width: 8px; height: 8px; border-radius: 50%; }
        .led-off { background: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.6); }
        .led-on { background: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.6); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- LOGIN -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md p-8 rounded-[2rem] space-y-6 border border-slate-700/80 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-gradient-to-br from-rose-600 to-pink-700 rounded-2xl mx-auto flex items-center justify-center mb-4"><i class="fa-solid fa-fingerprint text-white text-2xl"></i></div>
                <h2 class="text-xl font-black text-white uppercase tracking-wider">Acceso de Equipo</h2>
            </div>
            <form id="formLogin" class="space-y-4">
                <input type="email" id="loginEmail" required placeholder="correo@yesica.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs font-bold outline-none">
                <input type="password" id="loginPassword" required placeholder="Contraseña" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs font-bold outline-none">
                <button type="submit" class="w-full bg-rose-600 text-white font-black py-4 rounded-xl text-xs uppercase">INICIAR SESIÓN</button>
                <p id="loginError" class="text-rose-500 text-xs text-center font-tech hidden"></p>
            </form>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="glass-panel sticky top-0 z-40 px-6 py-4 border-b border-slate-800/80">
        <div class="max-w-[1800px] mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-white uppercase italic">Importaciones <span class="text-rose-500">Yesica</span></h1>
            <div class="flex items-center gap-4 bg-slate-950/80 px-4 py-2 rounded-xl border border-slate-800">
                <div class="flex flex-col"><span id="userNameLabel" class="text-white font-black text-xs uppercase">---</span></div>
                <button onclick="cerrarSesion()" class="text-slate-400 hover:text-white text-xs ml-3 pl-3 border-l border-slate-700"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-[1800px] mx-auto px-4 mt-10 space-y-8">
        <div id="contenedorFlota" class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            <div class="xl:col-span-1">
                <div class="glass-panel rounded-[2rem] p-8 shadow-2xl space-y-6">
                    <h2 class="text-sm font-black text-white uppercase border-b border-slate-700 pb-4">Inyectar Unidad</h2>
                    <form id="formIngreso" class="space-y-4">
                        <input type="text" id="vehiculo" required placeholder="Ej: Toyota Hilux" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none">
                        <button type="submit" class="w-full bg-rose-600 text-white font-black py-4 rounded-xl text-xs uppercase">AGREGAR NODO</button>
                    </form>
                </div>
            </div>
            <div class="xl:col-span-3">
                <div class="glass-panel rounded-[2rem] p-6 shadow-2xl min-h-[500px]">
                    <div id="listaVehiculos" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAg4xJoxrfGahtrZeOpnfhCPe6zqNjkGxk", authDomain: "sistema-yesica.firebaseapp.com", projectId: "sistema-yesica", storageBucket: "sistema-yesica.firebasestorage.app", messagingSenderId: "108033064871", appId: "1:108033064871:web:ce001ff12edb9f44e51782" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app); 

        const equipoYesica = {
            "alfre@yesica.com": { pass: "yesica2026", nombre: "Alfredo", rol: "admin" },
            "carlos@yesica.com": { pass: "yesica2026", nombre: "Carlos", rol: "finanzas" },
            "yesica@yesica.com": { pass: "yesica2026", nombre: "Yesica", rol: "finanzas" }
        };

        let perfilActual = JSON.parse(localStorage.getItem('yesica_perfil')) || null;
        if (perfilActual) { document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('userNameLabel').innerText = perfilActual.nombre; }

        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPassword').value.trim();
            if (equipoYesica[email] && equipoYesica[email].pass === pass) {
                localStorage.setItem('yesica_perfil', JSON.stringify(equipoYesica[email]));
                location.reload();
            } else { document.getElementById('loginError').classList.remove('hidden'); document.getElementById('loginError').innerText = "Datos incorrectos"; }
        });
        window.cerrarSesion = function() { localStorage.removeItem('yesica_perfil'); location.reload(); };

        // --- SISTEMA DE NOTIFICACIONES PUSH AL TELÉFONO ---
        async function enviarPushAlTelefono(rolDestino, titulo, mensaje) {
            // Canales privados para Importaciones Yesica
            const canales = {
                'admin': 'yesica_admin_sv_2026',
                'finanzas': 'yesica_finanzas_sv_2026',
                'marketing': 'yesica_marketing_sv_2026'
            };
            const canal = canales[rolDestino];
            if(!canal) return;

            try {
                await fetch(`https://ntfy.sh/${canal}`, {
                    method: 'POST',
                    body: mensaje,
                    headers: { 'Title': titulo, 'Tags': 'rotating_light,car', 'Priority': 'high' }
                });
            } catch(e) { console.log('Error enviando push', e); }
        }

        window.toggleTarea = async function(id, tareaId, estadoActual, vehiculo, nombreTarea) {
            let nuevoEstado = !estadoActual;
            await updateDoc(doc(db, "vehiculos", id), { [tareaId]: nuevoEstado });

            let destinatario = 'admin';
            if (tareaId.includes('pago')) destinatario = 'finanzas';
            if (tareaId.includes('grupo')) destinatario = 'marketing';

            // Dispara el Push al celular
            enviarPushAlTelefono(destinatario, "⚠️ Importaciones Yesica", `El vehículo ${vehiculo} requiere atención. ${nombreTarea} está ${nuevoEstado ? 'COMPLETADO' : 'PENDIENTE'} (Por: ${perfilActual.nombre})`);
        };

        document.getElementById('formIngreso').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "vehiculos"), { vehiculo: document.getElementById('vehiculo').value, t_pagoUsa: false, t_naviera: false, t_grupoWp: false });
            enviarPushAlTelefono('finanzas', "🚗 Nuevo Ingreso", `Se inyectó un nuevo vehículo. Pago USA pendiente.`);
            e.target.reset();
        });

        let snapshotGlobal = null;
        function cargarDatosTabla() {
            if (!snapshotGlobal) return;
            const lista = document.getElementById('listaVehiculos');
            lista.innerHTML = "";
            snapshotGlobal.forEach((docSnap) => {
                const auto = docSnap.data(); const id = docSnap.id;
                let btnTarea = (idKey, txt, icono) => `<button onclick="toggleTarea('${id}', '${idKey}', ${auto[idKey]}, '${auto.vehiculo}', '${txt}')" class="px-3 py-2 border rounded-xl flex justify-between items-center ${auto[idKey] ? 'bg-slate-800' : 'bg-slate-950 text-slate-400'}"><span class="text-[10px] font-black uppercase"><i class="${icono} mr-1"></i> ${txt}</span><div class="led ${auto[idKey] ? 'led-on' : 'led-off'}"></div></button>`;
                
                lista.innerHTML += `<div class="bg-slate-900/60 border border-slate-700/80 rounded-2xl p-5 mb-4"><h3 class="font-black text-white uppercase mb-4">${auto.vehiculo}</h3>
                    <div class="grid grid-cols-3 gap-3">${btnTarea('t_pagoUsa', 'Pago USA', 'fa-dollar-sign')} ${btnTarea('t_naviera', 'Naviera', 'fa-ship')} ${btnTarea('t_grupoWp', 'Wp Grupo', 'fa-whatsapp')}</div></div>`;
            });
        }
        onSnapshot(collection(db, "vehiculos"), snap => { snapshotGlobal = snap; if(perfilActual) cargarDatosTabla(); });
    </script>
</body>
</html>
